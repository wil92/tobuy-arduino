; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/platformio_generate_views.py

; LCDWiki 2.8inch ESP32-32E Display (E32R28T / E32N28T)
build_flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D SPI_FREQUENCY=20000000
    -D LOAD_FONT2=1
    -D TOBUY_TOUCH_SCK=25
    -D TOBUY_TOUCH_MISO=39
    -D TOBUY_TOUCH_MOSI=32
    -D TOBUY_TOUCH_CS=33

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@6.21.5
    links2004/WebSockets@2.6.1
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#f956c5d8ce3bf39169c7378416b89e7cfe70a034
